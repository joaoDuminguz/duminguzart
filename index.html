<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>João Duminguz — Game Art Director</title>
<meta name="description" content="Game Art Director, Character Artist, 2D and 3D game artist. Pixel art, concept art and illustration. The indie studio ultimate handyman.">

<meta property="og:title" content="João Duminguz — Game Art Director">
<meta property="og:description" content="Some see the pixels… I see the story.">
<meta property="og:image" content="https://duminguz.art/img/hero/backdrop.webp">
<meta property="og:url" content="https://duminguz.art/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Chakra+Petch:wght@300;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/brand.css">
<link rel="stylesheet" href="css/hero.css">
</head>

<body class="dgz-hero">

<!-- =====================================================================
     DGZ_homePage2, authored at 1920 x 1080.

     The page is NOT a 16:9 stage that scales whole any more. It fills the
     viewport and the composition anchors: the pitch holds the left edge, the
     mark holds the right, everything else stays centred, and the art covers
     from the top. Type comes from the named scale in brand.css.
     ===================================================================== -->
<main class="stage">

  <picture>
    <source media="(max-aspect-ratio: 1/1)"
            srcset="img/hero/backdrop-portrait-540.webp 540w,
                    img/hero/backdrop-portrait-720.webp 720w,
                    img/hero/backdrop-portrait.webp 1080w"
            sizes="100vw">
    <img class="stage__bg"
         src="img/hero/backdrop.webp"
         srcset="img/hero/backdrop-640.webp 640w,
                 img/hero/backdrop-1024.webp 1024w,
                 img/hero/backdrop-1440.webp 1440w,
                 img/hero/backdrop.webp 1920w"
         sizes="100vw"
         alt="" aria-hidden="true" width="1920" height="1080">
  </picture>

  <!-- Frame_window. The border is CSS; the two corner details are still missing. -->
  <div class="stage__frame" aria-hidden="true"></div>

  <!-- Three rows, distributed with space-between. The vertical rhythm is a
       relationship, not a set of coordinates, so it redistributes at any
       window height instead of leaving a hole or crushing the edges. -->
  <div class="stage__grid">

    <p class="stage__roles dgz-caption">
      Game Art Director | Character Artist | 2D &amp; 3D Game Artist<br>
      Pixel Art &middot; Concept Art &middot; Illustration
    </p>

    <div class="stage__body">
      <div class="stage__pitch">
        <!-- Two blocks, not one wrapped line. The break after "pixels..." is
             authored, and the second half is set in sky blue. -->
        <h1 class="dgz-h2">
          <span class="stage__pitch-a">Some see the<br>pixels&hellip;</span>
          <span class="stage__pitch-b">I see the story!</span>
        </h1>
        <p class="dgz-sub">Nice to meet you<br>I&rsquo;m the indie studio<br>ultimate handyman.</p>
      </div>

      <!-- The neon mark is three stacked groups; that is how the glow is built. -->
      <div class="stage__logo">
        <img src="img/hero/logo-a.svg" alt="Duminguz">
        <img src="img/hero/logo-b.svg" alt="" aria-hidden="true">
        <img src="img/hero/logo-c.svg" alt="" aria-hidden="true">
      </div>
    </div>

    <div class="stage__foot">
      <a class="stage__mail dgz-caption" href="mailto:duminguz.art@gmail.com">duminguz.art@gmail.com</a>

      <nav class="stage__links" aria-label="Profiles">
        <a class="is-linkedin dgz-button"   href="https://www.linkedin.com/in/duminguz/" target="_blank" rel="noopener">LinkedIn</a>
        <a class="is-artstation dgz-button" href="https://www.artstation.com/joaoduminguz" target="_blank" rel="noopener">ArtStation</a>
        <a class="is-behance dgz-button"    href="https://www.behance.net/duminguz" target="_blank" rel="noopener">Behance</a>
      </nav>
    </div>

  </div>

</main>

</body>
</html>
